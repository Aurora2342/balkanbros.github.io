<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BalkanBrosbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
      background: url('https://i.imgur.com/yourImage.png') no-repeat center/cover;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2em;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }

    .links a {
      text-decoration: none;
      background: #333;
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      transition: background 0.3s;
    }

    .links a:hover {
      background: #ff5722;
    }
  </style>
</head>
<body>
  <div class="profile-pic"></div>
  <h1>BalkanBrosBot</h1>
  <div class="links">
    <a href="https://discord.gg/MHecZNM49c">Discord</a>
    <a href="soon">GitHub</a>
  </div>
</body>
</html>
